<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorem Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f8fafc;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.1);width:100%;max-width:450px}
h2{text-align:center;margin-bottom:15px;color:#0f172a}
.ctrl{display:grid;gap:10px;margin-bottom:15px}
label{font-size:14px;color:#475569;display:flex;justify-content:space-between}
input,select{padding:6px;border:1px solid #e2e8f0;border-radius:6px}
.btns{display:flex;gap:8px}
button{flex:1;padding:8px;background:#3b82f6;color:white;border:none;border-radius:6px;cursor:pointer}
.out{background:#f1f5f9;padding:12px;border-radius:8px;min-height:100px;line-height:1.6;color:#334157;font-size:14px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
  <h2>📜 Lorem Generator</h2>
  <div class="ctrl">
    <label>Paragraflar: <input type="number" id="p" value="3" min="1" max="20"></label>
    <label>So'zlar/par: <input type="number" id="w" value="40" min="5" max="100"></label>
    <label>Format: <select id="fmt"><option value="text">Oddiy matn</option><option value="html"><p> HTML</option><option value="ul">• Ro'yxat</option></select></label>
  </div>
  <div class="btns"><button onclick="gen()">🔄 Yaratish</button><button onclick="copy()" style="background:#10b981">📋 Nusxa</button></div>
  <div class="out" id="out"></div>
</div>
<script>
const words=['lorem','ipsum','dolor','sit','amet','consectetur','adipiscing','elit','sed','do','eiusmod','tempor','incididunt','ut','labore','et','dolore','magna','aliqua','enim','ad','minim','veniam','quis','nostrud','exercitation','ullamco','laboris','nisi','aliquip','ex','ea','commodo','consequat'];
function gen(){
  const p=parseInt(document.getElementById('p').value);
  const w=parseInt(document.getElementById('w').value);
  const fmt=document.getElementById('fmt').value;
  let out='';
  for(let i=0;i<p;i++){
    let para=Array.from({length:w},()=>words[Math.floor(Math.random()*words.length)]).join(' ');
    para=para.charAt(0).toUpperCase()+para.slice(1)+'.';
    out+=fmt==='text'?para+'\n\n':fmt==='html'?`<p>${para}</p>\n`:`• ${para}\n`;
  }
  document.getElementById('out').innerHTML=out;
}
function copy(){navigator.clipboard.writeText(document.getElementById('out').innerText);alert('Nusxalandi!')}
gen();
</script>
</body>
</html>
